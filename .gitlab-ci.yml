variables:
  REPO_NAME: gitlab.tyo-arm.755022.xyz/sage/mikanarr-refactor
  CONTAINER_TEST_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  CONTAINER_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE:latest"
  DOCKER_TLS_CERTDIR: ''

stages:
  - test
  - publish
  - deploy

test:
  stage: test
  image: node:22.23.1-alpine3.24
  script:
    - npm ci
    - npm run check
    - npm audit --omit=dev --audit-level=high

.publish:
  stage: publish
  image: moby/buildkit:v0.12.5-rootless
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > ~/.docker/config.json
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        VERSION="latest"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        NOSLASH=$(echo "$CI_COMMIT_TAG" | tr -s / -)
        SANITIZED="${NOSLASH//[^a-zA-Z0-9\-\.]/}"
        VERSION="$SANITIZED"
      else
        NOSLASH=$(echo "$CI_COMMIT_REF_NAME" | tr -s / -)
        SANITIZED="${NOSLASH//[^a-zA-Z0-9\-]/}"
        VERSION="branch-$SANITIZED"
      fi
      BUILD_TIME=$(date +%Y%m%d_%H%M)
      IMAGE_TAG_TIME="${REGISTRY_IMAGE_NAME}:${TAG_PERFIX}-${BUILD_TIME}"
      IMAGE_TAG_VERSION="${REGISTRY_IMAGE_NAME}:${TAG_PERFIX}-${VERSION}"
      CACHE_IMAGE="${REGISTRY_IMAGE_NAME}:cache-${TAG_PERFIX}"
      echo "Building and pushing ${IMAGE_TAG_TIME}"
      buildctl-daemonless.sh build \
        --frontend=dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --import-cache type=registry,ref="${CACHE_IMAGE}" \
        --export-cache type=registry,ref="${CACHE_IMAGE}",mode=max \
        --output type=image,name="${IMAGE_TAG_TIME}",push=true
      echo "Tagging and pushing ${IMAGE_TAG_VERSION} from cache"
      buildctl-daemonless.sh build \
        --frontend=dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --import-cache type=registry,ref="${CACHE_IMAGE}" \
        --output type=image,name="${IMAGE_TAG_VERSION}",push=true

publish-arm:
  extends: .publish
  needs:
    - test
  tags:
    - k8s
    - arm
  only:
    refs:
      - master
  variables:
    REGISTRY_IMAGE_NAME: "${CI_REGISTRY_IMAGE}"
    TAG_PERFIX: arm64

deploy:
  stage: deploy
  image: alpine:3.24.1
  tags:
    - k8s
    - arm
  only:
    refs:
      - master
  needs:
    - publish-arm
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cat "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying ${CI_REGISTRY_IMAGE}:arm64-latest"
    - ssh -i ~/.ssh/id_rsa "$SSH_USER@$SERVER_IP" "cd ${APP_PATH} && IMAGE_NAME=${CI_REGISTRY_IMAGE}:arm64-latest docker compose pull && IMAGE_NAME=${CI_REGISTRY_IMAGE}:arm64-latest docker compose up -d --wait --force-recreate"
