variables:
  REPO_NAME: gitlab.tyo-arm.755022.xyz/sage/mikanarr-refactor
  CONTAINER_TEST_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  CONTAINER_RELEASE_IMAGE: "$CI_REGISTRY_IMAGE:latest"
  DOCKER_TLS_CERTDIR: ''
stages:
- publish
- deploy

.publish:
  stage: publish
  image: quay.io/buildah/stable
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
  before_script:
    - mkdir -p .config/containers
    - echo '[storage]' > .config/containers/storage.conf
    - echo 'driver = "vfs"' >> .config/containers/storage.conf
    - echo 'runroot = "/tmp/run"' >> .config/containers/storage.conf
    - echo 'graphroot = "/tmp/graph"' >> .config/containers/storage.conf
    - export CONTAINERS_STORAGE_CONF=$PWD/.config/containers/storage.conf
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
  - |
    if [ "$CI_COMMIT_REF_NAME" = $CI_DEFAULT_BRANCH ]; then
      VERSION="latest"
    elif [ -n "$CI_COMMIT_TAG" ];then
      NOSLASH=$(echo "$CI_COMMIT_TAG" | tr -s / - )
      SANITIZED="${NOSLASH//[^a-zA-Z0-9\-\.]/}"
      VERSION="$SANITIZED"
    else \
      NOSLASH=$(echo "$CI_COMMIT_REF_NAME" | tr -s / - )
      SANITIZED="${NOSLASH//[^a-zA-Z0-9\-]/}"
      VERSION="branch-$SANITIZED"
    fi
  - echo $VERSION
  - BUILD_TIME=`date +%Y%m%d_%H%M`
  - IMAGE_TAG_TIME="${REGISTRY_IMAGE_NAME}:${TAG_PERFIX}-${BUILD_TIME}"
  - IMAGE_TAG_VERSION="${REGISTRY_IMAGE_NAME}:${TAG_PERFIX}-${VERSION}"
  - echo "Building ${IMAGE_TAG_TIME} and ${IMAGE_TAG_VERSION}"
  - buildah build --isolation chroot --layers -f "${CI_PROJECT_DIR}/Dockerfile" -t "${IMAGE_TAG_TIME}" "${CI_PROJECT_DIR}"
  - buildah push "${IMAGE_TAG_TIME}"
  - buildah tag "${IMAGE_TAG_TIME}" "${IMAGE_TAG_VERSION}"
  - buildah push "${IMAGE_TAG_VERSION}"

publish-arm:
  extends: .publish
  stage: publish
  tags:
    - k8s
    - arm
  only:
    refs:
      - master
  variables:
    REGISTRY_IMAGE_NAME: "${CI_REGISTRY_IMAGE}"
    TAG_PERFIX: "arm64"

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - k8s
    - arm
  only:
    refs:
      - master
  needs:
    - publish-arm
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cat "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - dos2unix ~/.ssh/id_rsa
    #- cat ~/.ssh/id_rsa
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - echo "deploy stage."
    - ls -la
    - echo "重新应用docker compose中"
    - echo "IMAGE_NAME=${CI_REGISTRY_IMAGE}:arm64-latest"
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP "cd ${APP_PATH} && IMAGE_NAME=${CI_REGISTRY_IMAGE}:arm64-latest docker compose pull && IMAGE_NAME=${CI_REGISTRY_IMAGE}:arm64-latest docker compose up -d --force-recreate"
