name: Rendered UI polish QA

on:
  push:
    branches:
      - feat/ui-subscription-dashboard
    paths:
      - public/css/redesign.css
      - public/js/redesign.js
      - scripts/ui-polish-render-qa.mjs
      - .github/workflows/ui-polish-render-qa.yml

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-subscription-dashboard
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install app and browser driver
        run: |
          npm install --global --ignore-scripts npm@11.18.0
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Start app
        env:
          NODE_ENV: development
          ADMIN_USERNAME: qa-admin
          ADMIN_PASSWORD: qa-only-password
          COOKIE_SECURE: 'false'
          DATA_DIR: /tmp/mikanarr-ui-polish-render-data
          PORT: '12306'
        run: |
          node server/index.js >/tmp/mikanarr-ui-polish-render.log 2>&1 &
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:12306/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mikanarr-ui-polish-render.log
          exit 1
      - name: Check rendered UI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/ui-polish-render-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-polish-render
          path: /tmp/ui-polish-render/*
          if-no-files-found: error
