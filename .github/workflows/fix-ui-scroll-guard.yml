name: Fix UI pagination guard

on:
  push:
    branches:
      - feat/ui-subscription-dashboard
    paths:
      - .github/workflows/fix-ui-scroll-guard.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-subscription-dashboard
          fetch-depth: 0
      - name: Guard optional scroll API
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/js/redesign.js')
          text = path.read_text()
          old = "document.getElementById('pattern-card-view')?.scrollIntoView({ block: 'start', behavior: 'smooth' });"
          new = "document.getElementById('pattern-card-view')?.scrollIntoView?.({ block: 'start', behavior: 'smooth' });"
          if old not in text:
              raise SystemExit('scroll guard anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-ui-scroll-guard.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/redesign.js .github/workflows/fix-ui-scroll-guard.yml
          git commit -m "fix(ui): guard optional pagination scroll API"
          git push origin HEAD:feat/ui-subscription-dashboard
