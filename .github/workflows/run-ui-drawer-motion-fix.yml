name: Apply drawer motion fix

on:
  push:
    branches:
      - feat/ui-subscription-dashboard
    paths:
      - scripts/fix-ui-drawer-motion.js
      - .github/workflows/run-ui-drawer-motion-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-subscription-dashboard
          fetch-depth: 0
      - name: Apply drawer motion fix
        run: node scripts/fix-ui-drawer-motion.js
      - name: Validate syntax
        run: node --check public/js/redesign.js
      - name: Remove temporary helpers
        run: rm -f scripts/fix-ui-drawer-motion.js .github/workflows/run-ui-drawer-motion-fix.yml
      - name: Commit drawer motion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): make drawer transition perceptible"
          git push origin HEAD:feat/ui-subscription-dashboard
