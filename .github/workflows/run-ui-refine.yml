name: Run UI refinements

on:
  push:
    branches:
      - feat/ui-subscription-dashboard
    paths:
      - .github/workflows/run-ui-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-subscription-dashboard
          fetch-depth: 0
      - name: Apply refinements
        run: node scripts/refine-ui-layout.js
      - name: Validate syntax
        run: node --check public/js/redesign.js
      - name: Remove temporary helpers
        run: rm -f scripts/refine-ui-layout.js .github/workflows/run-ui-refine.yml .github/workflows/refine-ui-layout.yml
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): refine drawer layout and matching preview"
          git push origin HEAD:feat/ui-subscription-dashboard
