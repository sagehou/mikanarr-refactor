name: Run UI polish v2

on:
  push:
    branches:
      - feat/ui-subscription-dashboard
    paths:
      - scripts/polish-ui-v2.js
      - .github/workflows/run-ui-polish-v2.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-subscription-dashboard
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply UI polish
        run: node scripts/polish-ui-v2.js

      - name: Validate JavaScript and tests
        run: |
          node --check public/js/redesign.js
          npm install --global --ignore-scripts npm@11.18.0
          npm ci
          npm run check

      - name: Remove temporary helpers
        run: rm -f scripts/polish-ui-v2.js .github/workflows/run-ui-polish-v2.yml

      - name: Commit polished UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): polish alignment contrast and drawer motion"
          git push origin HEAD:feat/ui-subscription-dashboard
