name: UI visual QA

on:
  push:
    branches:
      - feat/ui-subscription-dashboard
    paths:
      - .github/workflows/ui-visual-qa.yml

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-subscription-dashboard

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install application and browser driver
        run: |
          npm install --global --ignore-scripts npm@11.18.0
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
          command -v google-chrome

      - name: Start isolated Mikanarr
        env:
          NODE_ENV: development
          ADMIN_USERNAME: qa-admin
          ADMIN_PASSWORD: qa-only-password
          COOKIE_SECURE: 'false'
          DATA_DIR: /tmp/mikanarr-ui-qa-data
          PORT: '12306'
        run: |
          node server/index.js > /tmp/mikanarr-ui-qa.log 2>&1 &
          echo $! > /tmp/mikanarr-ui-qa.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:12306/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mikanarr-ui-qa.log
          exit 1

      - name: Capture approved desktop and mobile states
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          cat > .ui-qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox']
          });
          const page = await browser.newPage({ viewport: { width: 1672, height: 941 }, deviceScaleFactor: 1 });
          page.on('console', message => {
            if (message.type() === 'error') console.error('[browser]', message.text());
          });

          await page.goto('http://127.0.0.1:12306/', { waitUntil: 'networkidle' });
          await page.waitForSelector('#login-container:not(.d-none)');
          await page.fill('#username', 'qa-admin');
          await page.fill('#password', 'qa-only-password');
          await page.click('#login-form button[type="submit"]');
          await page.waitForSelector('#main-container:not(.d-none)');

          await page.evaluate(() => {
            const app = window.mikanarrApp;
            if (!app) throw new Error('redesign app instance not exposed');

            const season = (total, downloaded) => ({
              seasonNumber: 1,
              monitored: true,
              statistics: {
                episodeCount: total,
                episodeFileCount: downloaded,
                totalEpisodeCount: total,
                percentOfEpisodes: total ? Math.round((downloaded / total) * 100) : 0
              }
            });
            const series = (title, total, downloaded) => ({
              title,
              titleSlug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
              seasons: [season(total, downloaded)],
              images: [{ coverType: 'poster', remoteUrl: '/images/icon.svg' }]
            });

            app.seriesLoadError = null;
            app.seriesList = [
              series('葬送的芙莉莲', 28, 28),
              series('进击的巨人 最终季', 16, 16),
              series('Mushoku Tensei S2', 24, 21),
              series('间谍过家家 第二季', 12, 12),
              series('Re:Zero S3', 16, 11),
              series('药屋少女的呢喃', 24, 24),
              series('胆大党', 12, 10),
              series('迷宫饭', 24, 22),
              series('我推的孩子 第二季', 13, 13),
              series('败犬女主太多了！', 12, 12),
              series('义妹生活', 12, 9)
            ];

            const raw = [
              ['葬送的芙莉莲', 'DMHY 动漫花园'],
              ['进击的巨人 最终季', 'Nyaa'],
              ['mushoku tensei s2', '动漫花园'],
              ['间谍过家家 第二季', 'DMHY 动漫花园'],
              ['孤独摇滚！', 'U2'],
              ['re:zero s3', 'Nyaa'],
              ['药屋少女的呢喃', 'DMHY 动漫花园'],
              ['胆大党', 'Nyaa'],
              ['迷宫饭', '动漫花园'],
              ['我推的孩子 第二季', 'DMHY 动漫花园'],
              ['败犬女主太多了！', 'Nyaa'],
              ['义妹生活', '动漫花园'],
              ['跃动青春', 'DMHY 动漫花园'],
              ['来自深渊', 'Nyaa']
            ];
            const patterns = raw.map(([name, group], index) => ({
              id: index + 1,
              series: name,
              season: '01',
              pattern: '(?<episode>\\d+)',
              language: 'Chinese',
              quality: 'WEBDL 1080p',
              offset: 0,
              releasegroup: group,
              remote: `https://mikanani.me/RSS/Bangumi?bangumiId=${3100 + index}`,
              last_matched_at: new Date(Date.now() - index * 5 * 60 * 60 * 1000).toISOString(),
              match_count: 20 + index
            }));

            app.currentView = 'card';
            app.allPatterns = patterns;
            app.filteredPatterns = patterns;
            app.uiCurrentPage = 1;
            document.getElementById('pattern-card-view').classList.remove('d-none');
            document.getElementById('pattern-table-view').classList.add('d-none');
            app.renderCurrentView(patterns);
            app.updatePatternSummary();

            const selected = document.querySelectorAll('.card-checkbox');
            [0, 1, 5].forEach(index => { if (selected[index]) selected[index].checked = true; });
            app.updateBatchUI();

            app.currentPatternId = patterns[0].id;
            app.showPatternEdit(patterns[0]);
            app.rssItems = [
              '[DMHY] 葬送的芙莉莲 - 03 [简体][1080P]',
              '葬送のフリーレン 第 04 話 [1080p]',
              'Sousou no Frieren - Episode 05 [WEBRip 1080p]'
            ];
            app.renderRssPreview();
          });

          await page.waitForTimeout(600);
          await page.evaluate(() => {
            const palette = ['#ccd9dc', '#d9cdbf', '#c7d3cb', '#d8c7c8', '#c8d0dc', '#d9d3bd', '#cbd7ce', '#d5c9d8', '#d7d2c8', '#c7d6d8', '#d9c9bd', '#cdd0d9'];
            document.querySelectorAll('.pattern-card-poster').forEach((poster, index) => {
              poster.style.background = `linear-gradient(145deg, ${palette[index % palette.length]}, #eef1f2)`;
              const img = poster.querySelector('img');
              if (img) {
                const label = String(index + 1).padStart(2, '0');
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="180" height="260"><rect width="180" height="260" rx="18" fill="${palette[index % palette.length]}"/><circle cx="90" cy="94" r="42" fill="#ffffff" fill-opacity=".48"/><path d="M52 184c17-29 59-37 77-5 8 14 12 31 12 47H39c0-17 4-30 13-42z" fill="#fff" fill-opacity=".58"/><text x="90" y="242" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#586773">${label}</text></svg>`;
                img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
              }
            });
          });

          fs.mkdirSync('/tmp/ui-qa', { recursive: true });
          await page.screenshot({ path: '/tmp/ui-qa/desktop.png', fullPage: false });

          await page.evaluate(() => window.mikanarrApp.showPatternList());
          await page.setViewportSize({ width: 390, height: 844 });
          await page.waitForTimeout(250);
          await page.screenshot({ path: '/tmp/ui-qa/mobile.png', fullPage: false });

          await browser.close();
          JS
          node .ui-qa.mjs
          rm .ui-qa.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: ui-visual-qa
          path: /tmp/ui-qa/*.png
          if-no-files-found: error
