name: Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use the project npm version
        run: npm install --global --ignore-scripts npm@11.18.0 && test "$(npm --version)" = "11.18.0"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high
