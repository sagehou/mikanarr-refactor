services:
  mikanarr:
    image: ${IMAGE_NAME:-ghcr.io/sagehou/mikanarr-refactor:latest}
    container_name: mikanarr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 12306
      TZ: Asia/Shanghai
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:12306:12306
    volumes:
      - mikanarr-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:12306/api/health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mikanarr-data:
